<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Mini App Test</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body{
      margin:0;
      background:#111;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    .card{
      background:#1e1e1e;
      border-radius:18px;
      padding:20px;
      max-width:500px;
      margin:auto;
    }

    .row{
      background:#2a2a2a;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }

    .label{
      color:#999;
      font-size:13px;
      margin-bottom:5px;
    }

    .value{
      font-size:18px;
      word-break:break-word;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#2f80ed;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .success{
      color:#5cff8d;
    }

    .error{
      color:#ff6b6b;
    }
  </style>
</head>
<body>

<div class="card">

  <div class="row">
    <div class="label">Имя</div>
    <div class="value" id="name">Нет данных</div>
  </div>

  <div class="row">
    <div class="label">Telegram ID</div>
    <div class="value" id="userid">Нет данных</div>
  </div>

  <div class="row">
    <div class="label">Баланс</div>
    <div class="value" id="balance">Нет данных</div>
  </div>

  <div class="row">
    <div class="label">Webhook статус</div>
    <div class="value" id="status">Ожидание...</div>
  </div>

  <button onclick="sendWebhook()">
    Отправить webhook
  </button>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const user = tg.initDataUnsafe?.user || {};

  // ===== USER =====

  document.getElementById("name").textContent =
    user.first_name || "Нет данных";

  document.getElementById("userid").textContent =
    user.id || "Нет данных";

  // ===== BALANCE =====

  const params = new URLSearchParams(window.location.search);

  const balance =
    params.get("balance") || "Нет данных";

  document.getElementById("balance").textContent =
    balance;

  // ===== WEBHOOK =====

  function sendWebhook(){

    const status =
      document.getElementById("status");

    status.textContent = "Отправка...";

    // GET запрос через image beacon
    // работает даже когда fetch режется CORS

    const webhookUrl =
      "https://enotpro.app/wh/1283602313/IfuR2Xs1gH58CLfwPxXGkt"
      + "?telegram_id=" + encodeURIComponent(user.id || "")
      + "&first_name=" + encodeURIComponent(user.first_name || "")
      + "&username=" + encodeURIComponent(user.username || "")
      + "&balance=" + encodeURIComponent(balance)
      + "&time=" + encodeURIComponent(new Date().toISOString());

    console.log("Webhook URL:", webhookUrl);

    const img = new Image();

    img.onload = () => {
      status.textContent =
        "Webhook отправлен ✅";

      status.className =
        "value success";
    };

    img.onerror = () => {

      // Даже при ошибке webhook МОЖЕТ дойти.
      // Потому что сервер webhook не image.

      status.textContent =
        "Webhook вероятно отправлен ✅";

      status.className =
        "value success";
    };

    img.src = webhookUrl;
  }

  // Автоотправка
  sendWebhook();
</script>

</body>
</html>
